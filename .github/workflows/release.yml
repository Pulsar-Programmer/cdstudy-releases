name: Desktop release

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [nightly, stable]
        default: nightly
      source_ref:
        description: Private source branch, tag, or commit
        default: main
        type: string
      version:
        description: Stable version (required for stable)
        type: string
      publish:
        description: Publish downloads after all builds pass
        type: boolean
        default: false
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: Pulsar-Programmer/cdstudy-releases
  T3CODE_SUPABASE_URL: ${{ vars.T3CODE_SUPABASE_URL }}
  T3CODE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.T3CODE_SUPABASE_PUBLISHABLE_KEY }}
  T3CODE_CELEDUS_SITE_URL: https://celedus.app
  T3CODE_TELEMETRY_ENABLED: "false"

defaults:
  run:
    shell: bash

jobs:
  metadata:
    if: github.event_name != 'schedule' || vars.NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Pulsar-Programmer/celedus
          ref: ${{ inputs.source_ref || (github.event_name == 'push' && github.ref_name) || 'main' }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/package.json
          sparse-checkout-cone-mode: false
      - id: meta
        env:
          CHANNEL: ${{ inputs.channel || (github.event_name == 'push' && 'stable') || 'nightly' }}
          VERSION: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const channel = process.env.CHANNEL;
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          const base = JSON.parse(readFileSync('apps/desktop/package.json')).version.replace(/[-+].*$/, '');
          let version;
          if (channel === 'stable') {
            version = process.env.VERSION.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Stable requires version X.Y.Z');
          } else {
            const [major,minor,patch] = base.split('.').map(Number);
            const date = new Date().toISOString().slice(0,10).replaceAll('-','');
            version = `${major}.${minor}.${patch+1}-nightly.${date}.${process.env.GITHUB_RUN_NUMBER}`;
          }
          let build = true;
          if (process.env.GITHUB_EVENT_NAME === 'schedule') {
            const releases = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`], {encoding:'utf8'}));
            build = !releases.some(r => !r.draft && r.tag_name.includes('-nightly.') && r.body?.includes(`Source commit: ${sha}`));
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nversion=${version}\ntag=v${version}\nchannel=${channel}\nbuild=${build}\n`);
          JS

  linux:
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Pulsar-Programmer/celedus
          ref: ${{ needs.metadata.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --filter=enceladus...
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick patchelf
      - name: Build Linux desktop
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "$VERSION"
      - name: Build Linux runtime for Windows WSL
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          node apps/server/scripts/cli.ts build-exe
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-runtime
          path: release-cli/*.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Collect Linux downloads
        run: |
          set -euo pipefail
          mkdir downloads
          cp release/*.AppImage release-cli/*.tar.gz downloads/
          for file in release/*.deb release/latest-linux.yml release/nightly-linux.yml release/*.blockmap; do
            [[ ! -f "$file" ]] || cp "$file" downloads/
          done
      - uses: actions/upload-artifact@v7
        with:
          name: downloads-linux-x64
          path: downloads/*
          retention-days: 1
          if-no-files-found: error

  desktop:
    needs: [metadata, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
          - runner: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
          - runner: windows-2025
            platform: win
            arch: x64
            target: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Pulsar-Programmer/celedus
          ref: ${{ needs.metadata.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --filter=enceladus...
      - uses: actions/download-artifact@v8
        if: matrix.platform == 'win'
        with:
          name: wsl-runtime
          path: wsl-runtime
      - name: Build desktop installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          args=(--platform "$PLATFORM" --target "$TARGET" --arch "$ARCH" --build-version "$VERSION")
          if [[ "$PLATFORM" == mac && -n "$CSC_LINK" ]]; then
            : "${CSC_KEY_PASSWORD:?Missing certificate password}"
            : "${APPLE_API_KEY:?Missing Apple API key}"
            : "${APPLE_API_KEY_ID:?Missing Apple Key ID}"
            : "${APPLE_API_ISSUER:?Missing Apple Issuer ID}"
            : "${APPLE_TEAM_ID:?Missing Apple Team ID}"
            : "${MACOS_PROVISIONING_PROFILE:?Missing provisioning profile}"
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key"
            export APPLE_API_KEY="$key"
            profile="$RUNNER_TEMP/cdstudy.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile"
            security cms -D -i "$profile" >/dev/null
            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile"
            args+=(--signed)
          elif [[ "$PLATFORM" == mac ]]; then
            echo '::warning::No Apple certificate configured; this build is unsigned.'
          fi
          if [[ "$PLATFORM" == win ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/*.tar.gz)
          fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect downloads
        run: |
          set -euo pipefail
          mkdir downloads
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest*.yml release/nightly*.yml; do
            name=$(basename "$file")
            if [[ "$PLATFORM" == mac && "$ARCH" == x64 && "$name" == *-mac.yml ]]; then
              name="${name%.yml}-x64.yml"
            fi
            cp "$file" "downloads/$name"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: downloads-${{ matrix.platform }}-${{ matrix.arch }}
          path: downloads/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [metadata, linux, desktop]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ needs.metadata.outputs.tag }}
      CHANNEL: ${{ needs.metadata.outputs.channel }}
      SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Pulsar-Programmer/celedus
          ref: ${{ needs.metadata.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...
      - uses: actions/download-artifact@v8
        with:
          pattern: downloads-*
          merge-multiple: true
          path: release-assets
      - name: Merge updater manifests and checksums
        run: |
          set -euo pipefail
          channel=latest
          [[ "$CHANNEL" != nightly ]] || channel=nightly
          node scripts/merge-update-manifests.ts --platform mac "release-assets/$channel-mac.yml" "release-assets/$channel-mac-x64.yml"
          rm "release-assets/$channel-mac-x64.yml"
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Publish complete release
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "Cd Study $TAG" --draft --notes "Source commit: $SOURCE_SHA")
          if [[ "$CHANNEL" == nightly ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest="$([[ "$CHANNEL" == stable ]] && echo true || echo false)" --repo "$GITHUB_REPOSITORY"
